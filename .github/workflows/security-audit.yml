name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  storage-policy:
    name: Cloudflare-only storage policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject disallowed decentralized storage integrations
        run: python scripts/check-storage-policy.py

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit hash-locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          # The scanner image applies and executes the reviewed local mitigation
          # below; upstream has not published a fixed DiskCache release.
          pip-audit --requirement requirements.txt --strict --ignore-vuln PYSEC-2026-2447
      - name: Verify DiskCache pickle mitigation
        run: |
          python -m pip install --disable-pip-version-check --no-deps diskcache==5.6.3
          python scripts/patch-diskcache-pysec-2026-2447.py
          python scripts/patch-diskcache-pysec-2026-2447.py --check

  codeql:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  trivy:
    name: Filesystem, container and configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository (dependencies, misconfigurations, secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
