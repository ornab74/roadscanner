name: Lock requirements + ML-DSA sign lock manifest

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - requirements.in
      - scripts/resign-pq-lock.py
      - .github/workflows/lock-requirements.yml

jobs:
  lock_and_pq_sign:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    defaults:
      run:
        shell: bash

    env:
      LIBOQS_VERSION: "0.14.0"
      LIBOQS_SHA256: "5b0df6138763b3fc4e385d58dbb2ee7c7c508a64a413d76a917529e3a9a207ea"
      LIBOQS_PYTHON_VERSION: "0.16.0"
      PQ_SIGNATURE_ALG: "ML-DSA-44"

    steps:
      - name: Install checkout and build tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl coreutils \
            cmake ninja-build build-essential pkg-config git
          rm -rf /var/lib/apt/lists/*

      # Git must exist before Checkout. Otherwise actions/checkout falls back to
      # an archive download, which has no .git directory for the commit step.
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install supported lock tooling
        run: |
          set -euo pipefail
          # Keep pip on the API level explicitly supported by pip-tools 7.5.3.
          # Do not upgrade pip independently: pip-tools uses pip internals.
          python -m pip install --no-cache-dir --upgrade \
            "pip==26.0.1" \
            "pip-tools==7.5.3"
          python -m pip --version
          pip-compile --version

      - name: Generate hash-locked requirements.txt
        run: |
          set -euo pipefail
          rm -f requirements.txt
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file requirements.txt \
            requirements.in

      - name: Build and install verified liboqs
        run: |
          set -euo pipefail
          LIBOQS_URL="https://github.com/open-quantum-safe/liboqs/archive/refs/tags/${LIBOQS_VERSION}.tar.gz"
          echo "LIBOQS_URL=${LIBOQS_URL}" >> "$GITHUB_ENV"

          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 \
            -o /tmp/liboqs.tar.gz "${LIBOQS_URL}"
          echo "${LIBOQS_SHA256}  /tmp/liboqs.tar.gz" | sha256sum -c -

          mkdir -p /tmp/liboqs-src
          tar -xzf /tmp/liboqs.tar.gz -C /tmp/liboqs-src --strip-components=1
          cmake -S /tmp/liboqs-src -B /tmp/liboqs-src/build \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_USE_OPENSSL=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -G Ninja
          cmake --build /tmp/liboqs-src/build --parallel
          cmake --install /tmp/liboqs-src/build
          ldconfig
          rm -rf /tmp/liboqs-src /tmp/liboqs.tar.gz

      - name: Install liboqs-python
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir "liboqs-python==${LIBOQS_PYTHON_VERSION}"
          python - <<'PY'
          import oqs
          enabled = set(oqs.get_enabled_sig_mechanisms())
          assert "ML-DSA-44" in enabled, f"ML-DSA-44 unavailable; enabled={sorted(enabled)}"
          print("oqs ready: ML-DSA-44 enabled")
          PY

      - name: Prepend verified provenance header
        run: |
          set -euo pipefail
          {
            echo "# liboqs_version=${LIBOQS_VERSION}"
            echo "# liboqs_tarball_sha256=${LIBOQS_SHA256}"
            echo "# liboqs_tarball_url=${LIBOQS_URL}"
            echo "# liboqs_python_version=${LIBOQS_PYTHON_VERSION}"
            echo "# pq_signature_alg=${PQ_SIGNATURE_ALG}"
            echo "# pq_manifest=lock.manifest.json"
            echo "# pq_signature=lock.manifest.pqsig"
            echo "# pq_pubkey=pq_pubkey.b64"
            echo "# generated_by=github_actions_lock_requirements"
            echo
            cat requirements.txt
          } > requirements.tmp
          mv requirements.tmp requirements.txt

      - name: ML-DSA sign canonical lock manifest
        run: |
          set -euo pipefail
          python scripts/resign-pq-lock.py

      - name: Verify generated lock and signature
        run: |
          set -euo pipefail
          python verify.py

      - name: Commit regenerated signed lock
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add \
            requirements.txt lock.manifest.json lock.manifest.pqsig pq_pubkey.b64
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "Signed dependency lock is already current."
          else
            git -C "$GITHUB_WORKSPACE" commit -m "Regenerate signed dependency lock"
            git -C "$GITHUB_WORKSPACE" push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload lock + PQ materials
        uses: actions/upload-artifact@v4
        with:
          name: pq-locked-requirements
          path: |
            requirements.txt
            lock.manifest.json
            lock.manifest.pqsig
            pq_pubkey.b64
          retention-days: 30
