name: Chromograph isolated validation
on:
  push:
    branches: [codex/cloudflare-v06-audit]
  pull_request:
    paths:
      - main.py
      - tests/chromograph/**
      - scripts/cloudflare_preflight.py
      - scripts/sign_cloud_manifest.py
      - scripts/chromograph_registry_ops.py
      - deploy/**
      - docs/chromograph/release.json
      - .github/workflows/chromograph-validation.yml
permissions:
  contents: read
concurrency:
  group: chromograph-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without persistent Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 ref
        with:
          python-version: "3.12"
      - name: Install hash-locked test dependencies only
        run: python -m pip install --disable-pip-version-check --require-hashes -r tests/chromograph/requirements.txt
      - name: Compile source without native startup
        run: python -m py_compile main.py scripts/cloudflare_preflight.py scripts/chromograph_registry_ops.py scripts/sign_cloud_manifest.py
      - name: Run isolated application and deployment-helper tests
        run: python -m pytest -q tests/chromograph --junitxml=TEST_RESULTS.xml
      - name: Verify production Containers gate remains closed
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          result = subprocess.run([sys.executable, "scripts/cloudflare_preflight.py", "--target", "containers-production"], text=True, capture_output=True)
          assert result.returncode == 2
          report = json.loads(result.stdout)
          assert report["ready"] is False
          assert any(check["check"] == "containers_production_gate" and check["ok"] is False for check in report["checks"])
          PY
