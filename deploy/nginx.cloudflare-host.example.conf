# TEMPLATE. Native-host loopback reverse proxy for the Access-validated tunnel.
# Change both occurrences of the hostname to the exact reviewed public origin.
server {
    listen 127.0.0.1:3001;
    server_name roadscanner-staging.example.com;
    client_max_body_size 300k;
    access_log off;
    error_log /var/log/nginx/roadscanner-error.log warn;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host roadscanner-staging.example.com;
        proxy_set_header X-Forwarded-Host roadscanner-staging.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store" always;
    }
}
