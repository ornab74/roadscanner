
<!DOCTYPE html>

<html data-page="register" lang="en">
<head>
<meta charset="utf-8"/>
<title>Register - QRS</title>
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
<meta content="noindex,nofollow" name="robots"/>
<link href="/favicon.svg" rel="icon" sizes="any"/>
<link crossorigin="anonymous" href="/static/css/roboto.css" integrity="sha256-Sc7BtUKoWr6RBuNTT0MmuQjqGVQwYBK+21lB58JwUVE=" rel="stylesheet"/>
<link crossorigin="anonymous" href="/static/css/orbitron.css" integrity="sha256-3mvPl5g2WhVLrUV4xX3KE8AV8FgrOz38KmWLqKXVh00=" rel="stylesheet"/>
<link crossorigin="anonymous" href="/static/css/bootstrap.min.css" integrity="sha256-Ww++W3rXBfapN8SZitAvc9jw2Xb+Ixt0rvDsmWmQyTo=" rel="stylesheet"/>
<link crossorigin="anonymous" href="/static/css/fontawesome.min.css" integrity="sha256-rx5u3IdaOCszi7Jb18XD9HSn8bNiEgAqWJbdBvIYYyU=" rel="stylesheet"/>

<link href="/pages/register.css" rel="stylesheet"/><link href="/pages/shared.css" rel="stylesheet"/></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<a class="navbar-brand" href="/home">QRS</a>
<button aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-target="#navbarNav" data-toggle="collapse" type="button">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse justify-content-end" id="navbarNav">
<ul class="navbar-nav">
<li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
<li class="nav-item"><a class="nav-link active" href="/register">Register</a></li>
</ul>
</div>
</nav>
<div class="container">
<div class="walkd shadow">
<div class="brand">QRS</div>
<h3 class="text-center">Register</h3>
<p aria-live="polite" class="error-message text-center" hidden="True" id="authError" role="alert"></p><form data-mode="register" id="authForm" method="POST" novalidate="">
<div class="form-group">
<label for="username">Email</label>
<input autocomplete="username" class="form-control" id="username" maxlength="254" name="email" placeholder="you@example.com" required="" type="email" value=""/>
</div>
<div class="form-group">
<label for="password">Password</label>
<input autocomplete="new-password" class="form-control" id="password" maxlength="256" minlength="12" name="password" placeholder="Choose a password" required="" type="password" value=""/>
<div aria-live="polite" class="pw-rules" id="pwRules">
<div class="pw-rules-title">Password requirements</div>
<div class="pw-rule bad" id="rule-len"><span aria-hidden="true" class="pw-icon"></span><span>At least 12 characters</span></div>




</div>
</div>
<input class="btn btn-primary btn-block" id="submit" name="submit" type="submit" value="Create account"/>
</form>
<p class="mt-3 text-center">Already have an account? <a href="/login">Login here</a></p>
</div>
</div>

<script crossorigin="anonymous" defer="True" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" src="/static/js/jquery.min.js"></script><script crossorigin="anonymous" defer="True" integrity="sha256-9nt4LsWmLI/O24lTW89IzAKuBqEZ47l/4rh1+tH/NY8=" src="/static/js/bootstrap.bundle.min.js"></script><script src="/pages/auth.mjs" type="module"></script></body>
</html>
