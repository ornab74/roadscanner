<body>
<nav class="navbar navbar-expand-lg navbar-dark">

<button aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-target="#navbarNav" data-toggle="collapse" type="button">

<div class="container">
<div class="walkd shadow">
<div class="brand">QRS</div>
<h3 class="text-center">Register</h3>
<p aria-live="polite" class="error-message text-center" hidden="True" id="authError" role="alert"></p><form data-mode="register" id="authForm" method="POST" novalidate="">
<div class="form-group">
<label for="username">Email</label>
<input autocomplete="username" class="form-control" id="username" maxlength="254" name="email" placeholder="you@example.com" required="" type="email" value=""/>
</div>
<div class="form-group">
<label for="password">Password</label>
<input autocomplete="new-password" class="form-control" id="password" maxlength="256" minlength="12" name="password" placeholder="Choose a password" required="" type="password" value=""/>
<div aria-live="polite" class="pw-rules" id="pwRules">
<div class="pw-rules-title">Password requirements</div>
<div class="pw-rule bad" id="rule-len"><span aria-hidden="true" class="pw-icon"></span><span>At least 12 characters</span></div>
</div>
</div>
<input class="btn btn-primary btn-block" id="submit" name="submit" type="submit" value="Create account"/>
</form>
<p class="mt-3 text-center">Already have an account? <a href="/login">Login here</a></p>
</div>
</div>
