<!DOCTYPE html>
<html data-page="radar" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Weather radar</title><link href="/pages/radar.css" rel="stylesheet"/><link href="/pages/shared.css" rel="stylesheet"/></head><body><main><a href="/dashboard">← Dashboard</a><h1>Weather radar</h1><p>Recent precipitation imagery from RainViewer. Radar is indicative and is not a road-condition or safety forecast.</p><section class="panel"><label>Latitude <input id="lat" max="85" min="-85" step="any" type="number" value="40.7128"/></label><label>Longitude <input id="lon" max="180" min="-180" step="any" type="number" value="-74.0060"/></label><label>Zoom <input id="zoom" max="7" min="0" type="number" value="5"/></label><button id="update">Update location</button><p id="status" role="status">Loading radar…</p><img alt="Radar tile at the selected coordinates" height="512" id="radar" width="512"/><p><button id="play">Play</button> <label>Frame <input id="frame" max="0" min="0" type="range" value="0"/></label> <span id="time"></span></p><small>Imagery © RainViewer. Tile boundaries may extend beyond the selected location. Availability and coverage vary.</small></section></main><script crossorigin="anonymous" defer="True" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" src="/static/js/jquery.min.js"></script><script crossorigin="anonymous" defer="True" integrity="sha256-9nt4LsWmLI/O24lTW89IzAKuBqEZ47l/4rh1+tH/NY8=" src="/static/js/bootstrap.bundle.min.js"></script><script src="/pages/radar.mjs" type="module"></script></body></html>
