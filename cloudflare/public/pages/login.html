<div class="container">
<div class="Spotd shadow">
<div class="brand">QRS</div>
<h3 class="text-center">Login</h3>
<p aria-live="polite" class="error-message text-center" hidden="True" id="authError" role="alert"></p><form data-mode="login" id="authForm" method="POST" novalidate="">
<div class="form-group">
<label for="username">Email</label>
<input autocomplete="username" class="form-control" id="username" maxlength="254" name="email" placeholder="you@example.com" required="" type="email" value=""/>
</div>
<div class="form-group">
<label for="password">Password</label>
<input autocomplete="current-password" class="form-control" id="password" maxlength="256" minlength="12" name="password" placeholder="Enter your password" required="" type="password" value=""/>
</div>
<input class="btn btn-primary btn-block" id="submit" name="submit" type="submit" value="Login"/>
</form><button class="btn btn-outline-light btn-block mt-3" id="passkeySignIn" type="button">Sign in with a passkey or security key</button>
<p class="mt-3 text-center">Don't have an account? <a href="/register">Register here</a></p>
</div>
</div>
