                          type: number
                        south:
                          type: number
                        east:
                          type: number
                        west:
                          type: number
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: qrs_live
  schemas:
    GarageVehicle:
      type: object
      required:
      - name
      - kind
      description: Typed mode-specific specs are validated server-side. Optional fields default to empty;
        unsupported fields are rejected. PUT also requires current version.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          type: string
          enum:
          - car
          - motorcycle
          - truck
          - train
          - aircraft
        make:
          type: string
          maxLength: 60
        model:
          type: string
          maxLength: 60
        year:
          type:
          - integer
          - 'null'
          minimum: 1880
        color:
          type: string
          maxLength: 40
        theme:
          type: string
          enum:
          - none
          - winter
          - halloween
          - autumn
          - festive
          - lunar_new_year
        appearance_notes:
          type: string
          maxLength: 400
        specs:
          type: object
          description: 'car: mass_kg,height_m,width_m,length_m,towing,trailer_length_m,fuel_economy_mpg;
            motorcycle: engine_cc,mass_kg,abs,fuel_economy_mpg; truck: configuration,height_m,width_m,length_m,trailer_length_m,mass_kg,axles,hazmat,fuel_economy_mpg,wheelbase_m,kingpin_to_axle_m,fifth_wheel_offset_m,turn_radius_m;
            train: length_m,mass_kg,rail_gauge_mm,traction; aircraft: airframe,rotor_diameter_m,true_airspeed_kt,fuel_burn_per_hour,fuel_capacity,fuel_unit,reserve_minutes,icao24,type_designator.
            configuration is rigid or articulated; airframe is fixed_wing or helicopter.
            towing,abs,hazmat are booleans; omitted values remain unknown. Total truck length and mass describe the loaded combination.
            All numeric values must be finite and positive, except reserve_minutes may be zero and fifth_wheel_offset_m is signed and may be zero. fuel_economy_mpg uses US gallons. turn_radius_m is a user-supplied circular scenario front-axle-center radius, not a measured road turn radius. Fuel units:
            gal,l,kg. icao24 is six hex characters.'
    VehicleNavigationProfile:
      type: object
      description: Vehicle-specific review context; specifications are user supplied, not independently verified restrictions or performance data.
      properties:
        version:
          type: integer
          const: 1
        kind:
          type: string
        label:
          type: string
        specifications:
          type: object
        focus:
          type: array
          items:
            type: string
        missing_profile_fields:
          type: array
          items:
            type: string
        specification_source:
          type: string
          const: USER_SUPPLIED
        geometry_policy:
          type: string
        instruction_style:
          type: string
    AircraftBriefingRequest:
      type: object
      additionalProperties: false
      required:
      - vehicle_id
      - start
      - destination
      - departure_airport
      - arrival_airport
      - altitude_ft
      - usable_fuel
      properties:
        vehicle_id:
          type: string
          format: uuid
        start:
          $ref: '#/components/schemas/BriefingCoordinate'
        destination:
          $ref: '#/components/schemas/BriefingCoordinate'
        departure_airport:
          type: string
          pattern: ^[A-Z0-9]{3,4}$
        arrival_airport:
          type: string
          pattern: ^[A-Z0-9]{3,4}$
        altitude_ft:
          type: number
          minimum: 0
          maximum: 45000
        usable_fuel:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1000000
    BriefingCoordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -85
          maximum: 85
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ScanRequest:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      - vehicle_type
      - destination
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        vehicle_type:
          type: string
          minLength: 1
          maxLength: 64
        destination:
          type: string
          minLength: 1
          maxLength: 256
        model:
          type: string
          enum:
          - llama_local
          - openai
          default: llama_local
        language:
          type: string
          enum:
          - en
          default: en
        road_type:
          type: string
          maxLength: 96
        weather:
          type: string
          maxLength: 96
        traffic:
          type: string
          maxLength: 96
        obstacles:
          type: string
          maxLength: 512
        sensor_notes:
          type: string
          maxLength: 1000
    ScanResponse:
      type: object
      required:
      - result
      - harm_level
      - model_used
      - report_id
      properties:
        result:
          type: string
        harm_level:
          type: string
        language:
          type: string
        model_used:
          type: string
        report_id:
          type: integer
    ApiProblem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        error:
          type: string
        detail:
          type: string
        request_id:
          type: string
          format: uuid
        required_scope:
          type: string
    KeyInfo:
      type: object
      required:
      - id
      - scopes
      - expires_at
      - request_id
      properties:
        id: *id008
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
          - integer
          - 'null'
          format: int64
        request_id: *id008
    Capabilities:
      type: object
      required:
      - api_version
      - authentication
      - key_scopes
      - features
      - quotas
      - request_id
      properties:
        api_version:
          type: string
          example: '2.1'
        authentication:
          type: string
          enum:
          - Bearer
        key_scopes:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        quotas:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        openapi_url:
          type: string
        docs_url:
          type: string
        scope:
          type: string
        request_id: *id008
    ReportSummary:
      type: object
      required:
      - report_id
      - created_at
      - operation_kind
      - url
      properties:
        report_id:
          type: integer
          minimum: 1
        created_at: *id009
        operation_kind:
          type: string
          enum:
          - scan
          - route
        url:
          type: string
          format: uri-reference
    ReportPage:
      type: object
      required:
      - data
      - pagination
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportSummary'
        pagination:
          type: object
          required:
          - limit
          - has_more
          - next_cursor
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            has_more:
              type: boolean
            next_cursor:
              type: &id010
              - string
              - 'null'
              maxLength: 600
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id: *id008
    OperationStatus:
      type: object
      required:
      - operation_id
      - status
      - kind
      - created_at
      - updated_at
      - credits_reserved_or_used
      - resource
      - poll_after_seconds
      - request_id
      properties:
        operation_id: *id008
        status:
          type: string
          enum:
          - reserved
          - completed
          - refunded
        kind:
          type: string
          enum:
          - scan
          - route
          - image
        created_at: *id009
        updated_at: *id009
        credits_reserved_or_used:
          type: integer
          enum:
          - 0
          - 1
        resource:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - url
            properties:
              url:
                type: string
                format: uri-reference
        poll_after_seconds:
          type:
          - integer
          - 'null'
        request_id: *id008
    GarageVehicleResponse:
      allOf:
      - $ref: '#/components/schemas/GarageVehicle'
      - type: object
        required:
        - id
        - version
        - image_url
        - created_at
        - updated_at
        properties:
          id: *id008
          version:
            type: integer
            minimum: 1
          image_url: &id011
            type: *id010
          created_at: *id009
          updated_at: *id009
    GarageCollection:
      type: object
      required:
      - vehicles
      - active_vehicle_id
      properties:
        vehicles:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/GarageVehicleResponse'
        active_vehicle_id: *id011
x-response-headers:
  X-Request-ID: Server-generated request UUID
  RateLimit-Limit: Applicable request budget
  RateLimit-Remaining: Remaining count in the reported window
  RateLimit-Reset: Reset epoch seconds
  Retry-After: Seconds to wait when rate-limited
