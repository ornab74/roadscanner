      x-required-scope: images:read
    post:
      summary: Generate GPT Image 2 illustration, gated by input/output PHF, costing one scan credit
      description: At most 2 attempts/account/day and 10 attempts globally/day. Requests are idempotent.
        Failures refund the reserved credit. Images expire after 90 days. Browser equivalent requires
        recent verification and CSRF; API keys authenticate directly.
      security:
      - ApiKey: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '201':
          description: Model metadata
          PHF results and private browser image_url; use this v1 path with your key to download: null
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
        '200':
          description: Idempotent replay without another generation or debit
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
        '402':
          description: Insufficient existing scan credits
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
