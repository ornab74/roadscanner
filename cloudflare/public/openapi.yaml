openapi: 3.1.0
info:
  title: QRoadScan Multimodal API
  version: 2.1.0
  description: Private multimodal garage, scene scans, visual road proposals and advisory aircraft briefings.
    Scoped Bearer keys, operation status, signed report pagination, request IDs and problem responses.
    Aircraft is not ATC or collision avoidance.
servers:
- url: https://ride.qroadscan.com
paths:
  /api/v1/scans:
    post:
      summary: Run and store one road-risk scan
      security:
      - ApiKey: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: Completed scan, including an idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
          headers:
            X-Request-ID: &id001
              description: Server-generated correlation ID
              schema: &id008
                type: string
                format: uuid
            RateLimit-Limit: &id002
              description: Applicable request budget
              schema:
                type: integer
            RateLimit-Remaining: &id003
              description: Remaining requests in reported window
              schema:
                type: integer
            RateLimit-Reset: &id004
              description: Window reset epoch seconds
              schema: &id009
                type: integer
                format: int64
        '400':
          description: Invalid JSON or scan fields
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          description: Missing/invalid/expired key. application/problem+json.
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '402':
          description: No API credits remain
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: The same request is still running or previously failed
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '413':
          description: Request body exceeds 32 KiB
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '415':
          description: Content-Type must be application/json
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          description: Rate limit or feature budget; inspect Retry-After.
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
            Retry-After:
              description: Seconds before retry
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          description: Scan provider unavailable; a reserved credit is refunded
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: Insufficient scope; required_scope in problem response.
          headers:
            X-Request-ID: *id001
            RateLimit-Limit: *id002
            RateLimit-Remaining: *id003
            RateLimit-Reset: *id004
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        default:
          description: Structured problem response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
      x-required-scope: scans:write
