services:
  roadscanner:
    image: ${ROADSCANNER_IMAGE:-roadscanner:local}
    env_file:
      - ${ROADSCANNER_ENV_FILE:-.env}
    build:
      # Rootless Docker cannot traverse /root. The installer deploys the
      # production checkout to /srv/roadscanner, so pin the build context there
      # instead of resolving '.' relative to the caller's working directory.
      context: ${ROADSCANNER_BUILD_CONTEXT:-/srv/roadscanner}
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    container_name: ${ROADSCANNER_CONTAINER:-roadscanner}
    restart: unless-stopped
    ports:
      - "${ROADSCANNER_BIND_ADDR:-127.0.0.1}:${ROADSCANNER_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    volumes:
      # main.py stores SQLite, backup/rekey markers, backups, and local models
      # under /var/data. Keep that state outside the read-only container layer.
      - roadscanner-data:/var/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${ROADSCANNER_PIDS_LIMIT:-256}
    mem_limit: ${ROADSCANNER_MEMORY_LIMIT:-768m}
    cpus: ${ROADSCANNER_CPU_LIMIT:-1.0}
    stop_grace_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER:-roadscanner-nginx}
    restart: unless-stopped
    depends_on:
      roadscanner:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot:ro
      - ./deploy/nginx/nginx-entrypoint.sh:/opt/roadscanner/nginx-entrypoint.sh:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec
      - /var/run:rw,nosuid,nodev,noexec
      - /tmp:rw,nosuid,nodev,noexec
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN to the public hostname}
    entrypoint: ["/bin/sh", "/opt/roadscanner/nginx-entrypoint.sh"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  certbot:
    image: certbot/certbot:v3.0.1
    container_name: ${CERTBOT_CONTAINER:-roadscanner-certbot}
    restart: unless-stopped
    depends_on: [nginx]
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN to the public hostname}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL for renewal notices}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      certbot certonly --webroot -w /var/www/certbot
      -d "$${CERTBOT_DOMAIN}" --email "$${CERTBOT_EMAIL}"
      --agree-tos --no-eff-email --non-interactive || true;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h; done

volumes:
  roadscanner-data:
  letsencrypt:
  certbot-webroot:
