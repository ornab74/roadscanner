[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stopforgreen"
version = "0.2.0"
description = "Advanced stoplight simulation and Pathway-to-Greenlights departure-time optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stopforgreen = "stopforgreen.cli:main"

[tool.setuptools.packages.find]
include = ["stopforgreen*"]
